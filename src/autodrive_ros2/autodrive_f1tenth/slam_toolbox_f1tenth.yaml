slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom_1
    map_frame: map
    base_frame: f1tenth_1
    scan_topic: /autodrive/f1tenth_1/lidar
    use_map_saver: true
    mode: mapping

    debug_logging: false
    # throttle_scans: 1
    throttle_scans: 2
    # scan_queue_size: 10
    scan_queue_size: 20
    transform_publish_period: 0.05
    # map_update_interval: 2.0
    map_update_interval: 5.0
    resolution: 0.05
    restamp_tf: false
    min_laser_range: 0.06
    max_laser_range: 10.0
    minimum_time_interval: 0.05
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # use_scan_matching: true
    #use_scan_matching: true
    use_scan_matching: false
    # use_scan_barycenter: false
    use_scan_barycenter: false
    # minimum_travel_distance: 0.15
    minimum_travel_distance: 0.20
    # minimum_travel_heading: 0.15
    minimum_travel_heading: 0.20
    check_min_dist_and_heading_precisely: false
    # scan_buffer_size: 10
    scan_buffer_size: 6
    scan_buffer_maximum_scan_distance: 10.0
    # link_match_minimum_response_fine: 0.45
    link_match_minimum_response_fine: 0.60
    # link_scan_maximum_distance: 1.5
    link_scan_maximum_distance: 1.0
    # loop_search_maximum_distance: 3.0
    # loop_search_maximum_distance: 1.5
    loop_search_maximum_distance: 1.0
    # do_loop_closing: true
    do_loop_closing: false
    # loop_match_minimum_chain_size: 10
    loop_match_minimum_chain_size: 15
    # loop_match_maximum_variance_coarse: 3.0
    loop_match_maximum_variance_coarse: 2.0
    # loop_match_minimum_response_coarse: 0.5
    loop_match_minimum_response_coarse: 0.65
    # loop_match_minimum_response_fine: 0.6
    loop_match_minimum_response_fine: 0.75

    # correlation_search_space_dimension: 0.3
    correlation_search_space_dimension: 0.2
    # correlation_search_space_resolution: 0.01
    correlation_search_space_resolution: 0.01
    # correlation_search_space_smear_deviation: 0.1
    correlation_search_space_smear_deviation: 0.05

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # distance_variance_penalty: 1.0
    distance_variance_penalty: 1.5
    # angle_variance_penalty: 2.0
    angle_variance_penalty: 3.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    # minimum_angle_penalty: 0.9
    minimum_angle_penalty: 0.95
    # minimum_distance_penalty: 0.8
    minimum_distance_penalty: 0.9
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
