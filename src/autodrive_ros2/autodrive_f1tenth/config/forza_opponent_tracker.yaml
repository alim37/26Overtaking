    lambda_angle_deg: 10.0
    lidar_sigma_m: 0.03
    min_two_point_distance_m: 0.01
    min_cluster_beams: 5
    max_cluster_size_m: 0.70
    opponent_length_m: 0.55
    opponent_width_m: 0.30
    max_viewing_distance_m: 9.0
    boundary_inflation_m: 0.08
    association_distance_m: 0.45
