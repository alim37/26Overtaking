    min_classification_measurements: 6
    static_std_threshold_m: 0.08
    dynamic_std_threshold_m: 0.16
    min_dynamic_speed_mps: 0.20
    track_ttl_scans: 10
    dynamic_hold_scans: 12
    max_front_angle_deg: 70.0
    confidence_green_threshold: 0.90
